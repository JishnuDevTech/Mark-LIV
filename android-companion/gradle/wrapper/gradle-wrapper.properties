distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# AGP 8.7.3 is supported by Gradle 8.9. Keep the wrapper on this
# stable Android Studio 2025.3-compatible compatibility line.
# Use the direct downloads host because services.gradle.org can time out
# before its redirect reaches the release CDN on filtered networks.
distributionUrl=https\://downloads.gradle.org/distributions/gradle-8.9-bin.zip
# A distribution download may cross a redirect/CDN boundary and is much larger
# than a normal dependency request.
networkTimeout=600000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
